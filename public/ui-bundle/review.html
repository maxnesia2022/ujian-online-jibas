        window.KIOSK_BUNDLE = true;
        window.__KIOSK_BUNDLE__ = true;
        (function () {
            var params = new URLSearchParams(window.location.search);
            var serverParam = params.get('server');
            var savedServer = null;
            try { savedServer = localStorage.getItem('kiosk_base_url'); } catch (e) {}
            var resolvedBase = serverParam || savedServer || "http:\/\/192.168.43.153:8080";
            if (resolvedBase) {

            }
            window.KIOSK_BASE_URL = resolvedBase;

        window.KIOSK_WS_URL = "ws:\/\/192.168.43.153:8060\/ws";

        // Sinkronisasi sesi Kiosk WebView (cross-origin / debug mode):
        // Otomatis sertakan X-Session-ID dan Authorization header pada setiap request fetch,
        // menjamin autentikasi sesi tetap aktif walau cookie pihak ketiga diblokir oleh WebView.
        (function () {
            var origFetch = window.fetch;
            window.fetch = function (url, options) {
                options = options || {};
                var sessId = null;
                try { sessId = localStorage.getItem('kiosk_session_id'); } catch (e) {}
                if (sessId) {
                    options.headers = options.headers || {};
                    if (options.headers instanceof Headers) {
                        if (!options.headers.has('X-Session-ID')) options.headers.append('X-Session-ID', sessId);
                        if (!options.headers.has('Authorization')) options.headers.append('Authorization', 'Bearer ' + sessId);
                    } else if (Array.isArray(options.headers)) {
                        options.headers.push(['X-Session-ID', sessId]);
                        options.headers.push(['Authorization', 'Bearer ' + sessId]);
                    } else {
                        if (!options.headers['X-Session-ID']) options.headers['X-Session-ID'] = sessId;
                        if (!options.headers['Authorization']) options.headers['Authorization'] = 'Bearer ' + sessId;
                    }
                }
                return origFetch.call(this, url, options);
            };
        })();
    </script>
    <style>
        /* Design system kiosk — kontras tinggi, target sentuh besar.
           Sasaran: HP kelas bawah (mis. Redmi 10A 720x1600) dengan layar redup,
           dipakai siswa yang gugup. Prioritas: keterbacaan > dekorasi.
           Tanpa webfont (anggaran bundle); hanya system font stack. */
        :root {
            --kiosk-bg: #f1f5f9; --kiosk-card: #ffffff; --kiosk-ink: #0f172a;
            --kiosk-muted: #475569; --kiosk-primary: #1d4ed8; --kiosk-primary-ink: #ffffff;
            --kiosk-border: #cbd5e1; --kiosk-danger: #b91c1c; --kiosk-danger-bg: #fef2f2;
            --kiosk-ok: #15803d; --kiosk-ok-bg: #f0fdf4; --kiosk-warn: #a16207;
            --kiosk-ink-soft: #334155; --kiosk-surface-2: #f8fafc;
            --kiosk-shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 8px 24px rgba(15, 23, 42, .06);
            /* Target sentuh minimum Android 48dp; 56px untuk aksi utama. */
            --k-tap: 56px; --k-radius: 12px; --k-gap: 16px;
            /* Poni dan bilah gestur Android: tanpa ini header nyelip di balik
               status bar dan tombol terakhir ketiban bilah navigasi. */
            --k-safe-top: env(safe-area-inset-top, 0px);
            --k-safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; background: var(--kiosk-bg); color: var(--kiosk-ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 17px; line-height: 1.55;
            -webkit-text-size-adjust: 100%;
        }
        .k-wrap { max-width: 560px; margin: 0 auto; padding: var(--k-gap);
                  padding-bottom: calc(var(--k-gap) + var(--k-safe-bottom)); }
        .k-card { background: var(--kiosk-card); border: 1px solid var(--kiosk-border);
                  border-radius: var(--k-radius); padding: 20px; box-shadow: var(--kiosk-shadow); }

        /* ── App bar: identitas sekolah, sama di semua halaman ──────────────
           Alasannya bukan hiasan. Perangkat ujian dipegang siswa yang gugup di
           ruangan asing; layar yang tidak menyebut sekolahnya terasa seperti
           halaman uji coba, bukan lembar ujian resmi. */
        .k-appbar {
            display: flex; align-items: center; gap: 12px;
            padding: calc(10px + var(--k-safe-top)) var(--k-gap) 10px;
            background: var(--kiosk-card); border-bottom: 1px solid var(--kiosk-border);

        .k-appbar__school { font-weight: 700; font-size: 16px; line-height: 1.25;
                            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .k-appbar__tagline { color: var(--kiosk-muted); font-size: 12px; letter-spacing: .02em;
                             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Judul halaman: konteks "saya sedang di mana" tanpa memakan satu layar. */
        .k-pagehead { margin-bottom: var(--k-gap); }
        .k-pagehead h1 { margin: 0 0 2px; }
        .k-pagehead p { margin: 0; color: var(--kiosk-muted); font-size: 15px; }
        h1, h2, h3 { margin: 0 0 12px; line-height: 1.3; }
        h1 { font-size: 24px; } h2 { font-size: 20px; } h3 { font-size: 18px; }
        .k-muted { color: var(--kiosk-muted); font-size: 15px; }

        /* Tombol: tinggi penuh, teks 17px, tidak pernah mengecil di layar sempit. */
        .k-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; min-height: var(--k-tap); padding: 12px 18px;
            background: var(--kiosk-primary); color: var(--kiosk-primary-ink);
            border: 0; border-radius: var(--k-radius);
            font-size: 17px; font-weight: 600; font-family: inherit;
            cursor: pointer; text-decoration: none;
        }
        .k-btn:active { filter: brightness(.92); }
        .k-btn:disabled { opacity: .5; }
        .k-btn--ghost { background: transparent; color: var(--kiosk-primary);
                        border: 2px solid var(--kiosk-border); }
        .k-btn--danger { background: var(--kiosk-danger); }
        .k-btn--sm { min-height: 48px; font-size: 16px; width: auto; padding: 10px 16px; }

        .k-input {
            width: 100%; min-height: var(--k-tap); padding: 14px;

        .k-input:focus { outline: none; border-color: var(--kiosk-primary); }

        /* Kotak status: dipakai untuk error/sukses/info yang harus terbaca jelas. */
        .k-note { border-radius: 10px; padding: 14px; font-size: 16px; border: 1px solid; }
        .k-error { color: var(--kiosk-danger); background: var(--kiosk-danger-bg); border-color: #fecaca; }
        .k-ok { color: var(--kiosk-ok); background: var(--kiosk-ok-bg); border-color: #bbf7d0; }

        /* Bar identitas: siswa harus selalu tahu login sebagai siapa. */
        .k-idbar {
            display: flex; align-items: center; gap: 12px;
            background: var(--kiosk-card); border-bottom: 1px solid var(--kiosk-border);

        .k-idbar__who { flex: 1; min-width: 0; }

        /* Banner status simpan — menempel di atas viewport dan TIDAK hilang
           sendiri; satu-satunya cara lenyap adalah jawaban berhasil tersimpan. */
        /* sticky, bukan fixed: sebagai fixed banner ini menimpa bagian atas
           soal justru ketika siswa paling perlu membacanya. Sticky tetap
           menempel saat digulir tapi ikut memakan ruang, jadi tidak ada yang

        .k-savebar {
            position: sticky; top: 0; z-index: 9999;
            padding: 12px var(--k-gap); border-bottom: 3px solid;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .18);

        .k-savebar--bad { background: #fee2e2; border-color: var(--kiosk-danger); color: #7f1d1d; }

        .k-savebar__msg { font-size: 14px; margin-top: 2px; }

        /* Toast peredam aksi (cadangan non-kiosk) — melayang di bawah agar
           tidak menutupi soal maupun banner status simpan di atas. */
        .k-ratetoast {
            position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
            z-index: 9998; max-width: 88vw;
            background: rgba(15, 23, 42, .94); color: #fff;
            padding: 12px 18px; border-radius: 999px;
            font-size: 15px; text-align: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .25);
        }

        /* Konten dari editor guru (soal, jawaban esai, kunci) bebas isinya:
           gambar berukuran asli, tabel lebar, kata panjang tanpa spasi. Tanpa
           pagar ini semuanya menembus kartu dan bikin halaman melar ke samping. */
        .k-card { overflow-wrap: anywhere; }
        .k-card img, .k-note img {
            max-width: 100%; height: auto; display: block;
            margin: 12px 0; border: 1px solid var(--kiosk-border);
            border-radius: 10px; background: #fff;
        }
        /* Tabel lebar digulir di dalam kartunya sendiri, bukan menggeser halaman. */

        .k-row { display: flex; gap: 12px; }
        .k-row > * { flex: 1; }
        .k-stack > * + * { margin-top: 12px; }
    </style>
</head>

<div class="k-wrap">
    <div class="k-pagehead">
        <h1>Review Jawaban</h1>
        <p>Bandingkan jawaban Anda dengan kuncinya.</p>
    </div>
    <div id="review" class="k-stack">
        <div class="k-card k-muted">Memuat review…</div>
    </div>
    <button class="k-btn k-btn--ghost" type="button" style="margin-top:16px"
            onclick="location.href='dashboard.html'">Kembali ke Beranda</button>
</div>

<script>
    (function () {
        var base = window.KIOSK_BASE_URL;
        var params = new URLSearchParams(location.search);
        var wrap = document.getElementById('review');

        function el(tag, cls, text) {
            var n = document.createElement(tag);
            if (cls) n.className = cls;
            if (text !== undefined && text !== null) n.textContent = text;
            return n;
        }

        function note(cls, msg) {
            wrap.innerHTML = '';
            wrap.appendChild(el('div', 'k-note ' + cls, msg));
        }

        // Teks pasangan berasal dari bank soal (boleh mengandung apa saja), jadi
        // seluruhnya lewat textContent — beda dari question_text yang memang
        // markup dari editor guru.
        function matchingBlock(pairs, showCorrect) {
            var box = el('div');
            box.style.cssText = 'margin-top:4px';

            pairs.forEach(function (p) {
                var answered = p.user !== '';
                var accent = !answered ? 'var(--kiosk-border)'
                    : (showCorrect ? (p.is_correct ? 'var(--kiosk-ok)' : 'var(--kiosk-danger)') : 'var(--kiosk-primary)');

                var row = el('div');
                row.style.cssText = 'border-left:4px solid ' + accent +
                    ';padding:8px 0 8px 12px;margin-bottom:8px';

                row.appendChild(el('div', 'k-muted', p.left));

                var val = el('div', null, answered ? p.user : '(tidak dijawab)');
                val.style.cssText = 'font-weight:600' + (answered ? '' : ';color:var(--kiosk-muted)');
                row.appendChild(val);

                // Kunci hanya ditampilkan pada pasangan yang memang salah —
                // membocorkan semuanya membuat blok ini sulit dibaca.
                if (showCorrect && p.correct !== null && !p.is_correct) {
                    var key = el('div', null, 'Seharusnya: ' + p.correct);
                    key.style.cssText = 'font-size:15px;color:var(--kiosk-ok);margin-top:2px';
                    row.appendChild(key);
                }
                box.appendChild(row);
            });
            return box;
        }

        fetch(base + '/api/student/review?test_id=' + encodeURIComponent(params.get('test_id') || ''), {
            credentials: 'include', headers: { 'Accept': 'application/json' }
        })
            .then(function (r) { return r.json(); })
            .then(function (j) {
                if (j.status !== 'success') { note('k-error', j.message || 'Gagal memuat review.'); return; }
                if (!j.allow_review) { note('k-error', 'Review jawaban tidak tersedia untuk ujian ini.'); return; }

                wrap.innerHTML = '';
                j.questions.forEach(function (q, i) {
                    var card = el('div', 'k-card');

                    card.appendChild(el('div', 'k-muted', 'Soal ' + (i + 1) + ' dari ' + j.questions.length));

                    // question_text & answer_text berasal dari editor guru dan memang
                    // boleh mengandung markup (gambar, format) — innerHTML disengaja
                    // di sini, berbeda dengan nama ujian di dashboard yang teks polos.
                    var qt = el('div');
                    qt.style.cssText = 'margin:8px 0 14px;font-size:17px';
                    qt.innerHTML = q.question_text || '';
                    card.appendChild(qt);

                    // Menjodohkan & Benar/Salah punya bentuk sendiri: satu baris per
                    // pasangan, supaya terlihat mana yang cocok dan mana yang tidak.
                    if (q.matching && q.matching.length) {
                        card.appendChild(matchingBlock(q.matching, j.show_correct));
                        wrap.appendChild(card);
                        return;
                    }

                    var userAns = (q.user_answers || []).map(function (a) { return a.answer_text; });
                    var answered = userAns.length > 0;

                    var mine = el('div');
                    mine.style.cssText = 'border-left:4px solid ' +
                        (answered ? 'var(--kiosk-primary)' : 'var(--kiosk-border)') +
                        ';padding-left:12px;margin-bottom:8px';
                    mine.appendChild(el('div', 'k-muted', 'Jawaban Anda'));
                    var mineVal = el('div');
                    mineVal.style.cssText = 'font-weight:600';
                    if (answered) { mineVal.innerHTML = userAns.join(', '); }
                    else { mineVal.textContent = '(tidak dijawab)'; mineVal.style.color = 'var(--kiosk-muted)'; }
                    mine.appendChild(mineVal);
                    card.appendChild(mine);

                    var correct = (q.correct_answers || []).map(function (a) { return a.answer_text; });
                    if (j.show_correct && correct.length) {
                        var key = el('div');
                        key.style.cssText = 'border-left:4px solid var(--kiosk-ok);padding-left:12px';
                        key.appendChild(el('div', 'k-muted', 'Kunci jawaban'));
                        var keyVal = el('div');
                        keyVal.style.cssText = 'font-weight:600;color:var(--kiosk-ok)';
                        keyVal.innerHTML = correct.join(', ');
                        key.appendChild(keyVal);
                        card.appendChild(key);
                    }

                    wrap.appendChild(card);
                });
            })
            .catch(function () { note('k-error', 'Tidak dapat terhubung ke server.'); });
    })();
</script>
