    <script>
        window.KIOSK_BUNDLE = true;
        window.__KIOSK_BUNDLE__ = true;
        (function () {
            var params = new URLSearchParams(window.location.search);
            var serverParam = params.get('server');
            var savedServer = null;
            try { savedServer = localStorage.getItem('kiosk_base_url'); } catch (e) {}
            var resolvedBase = serverParam || savedServer || "http:\/\/192.168.43.153:8080";
            if (resolvedBase) {
                try { localStorage.setItem('kiosk_base_url', resolvedBase); } catch (e) {}
            }
            window.KIOSK_BASE_URL = resolvedBase;
        })();
        window.KIOSK_WS_URL = "ws:\/\/192.168.43.153:8060\/ws";

        // Sinkronisasi sesi Kiosk WebView (cross-origin / debug mode):
        // Otomatis sertakan X-Session-ID dan Authorization header pada setiap request fetch,
        // menjamin autentikasi sesi tetap aktif walau cookie pihak ketiga diblokir oleh WebView.
        (function () {
            var origFetch = window.fetch;
            window.fetch = function (url, options) {
                options = options || {};
                var sessId = null;
                try { sessId = localStorage.getItem('kiosk_session_id'); } catch (e) {}
                if (sessId) {
                    options.headers = options.headers || {};
                    if (options.headers instanceof Headers) {
                        if (!options.headers.has('X-Session-ID')) options.headers.append('X-Session-ID', sessId);
                        if (!options.headers.has('Authorization')) options.headers.append('Authorization', 'Bearer ' + sessId);
                    } else if (Array.isArray(options.headers)) {
                        options.headers.push(['X-Session-ID', sessId]);
                        options.headers.push(['Authorization', 'Bearer ' + sessId]);
                    } else {
                        if (!options.headers['X-Session-ID']) options.headers['X-Session-ID'] = sessId;
                        if (!options.headers['Authorization']) options.headers['Authorization'] = 'Bearer ' + sessId;
                    }
                }
                return origFetch.call(this, url, options);
            };
        })();
    </script>
    <style>
        /* Design system kiosk — kontras tinggi, target sentuh besar.
           Sasaran: HP kelas bawah (mis. Redmi 10A 720x1600) dengan layar redup,
           dipakai siswa yang gugup. Prioritas: keterbacaan > dekorasi.
           Tanpa webfont (anggaran bundle); hanya system font stack. */
        :root {
            --kiosk-bg: #f1f5f9; --kiosk-card: #ffffff; --kiosk-ink: #0f172a;
            --kiosk-muted: #475569; --kiosk-primary: #1d4ed8; --kiosk-primary-ink: #ffffff;
            --kiosk-border: #cbd5e1; --kiosk-danger: #b91c1c; --kiosk-danger-bg: #fef2f2;
            --kiosk-ok: #15803d; --kiosk-ok-bg: #f0fdf4; --kiosk-warn: #a16207;
            --kiosk-ink-soft: #334155; --kiosk-surface-2: #f8fafc;
            --kiosk-shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 8px 24px rgba(15, 23, 42, .06);
            /* Target sentuh minimum Android 48dp; 56px untuk aksi utama. */
            --k-tap: 56px; --k-radius: 12px; --k-gap: 16px;
            /* Poni dan bilah gestur Android: tanpa ini header nyelip di balik
               status bar dan tombol terakhir ketiban bilah navigasi. */
            --k-safe-top: env(safe-area-inset-top, 0px);
            --k-safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; background: var(--kiosk-bg); color: var(--kiosk-ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 17px; line-height: 1.55;
            -webkit-text-size-adjust: 100%;
        }
        .k-wrap { max-width: 560px; margin: 0 auto; padding: var(--k-gap);
                  padding-bottom: calc(var(--k-gap) + var(--k-safe-bottom)); }
        .k-card { background: var(--kiosk-card); border: 1px solid var(--kiosk-border);
                  border-radius: var(--k-radius); padding: 20px; box-shadow: var(--kiosk-shadow); }

        /* ── App bar: identitas sekolah, sama di semua halaman ──────────────
           Alasannya bukan hiasan. Perangkat ujian dipegang siswa yang gugup di
           ruangan asing; layar yang tidak menyebut sekolahnya terasa seperti
           halaman uji coba, bukan lembar ujian resmi. */
        .k-appbar {
            display: flex; align-items: center; gap: 12px;
            padding: calc(10px + var(--k-safe-top)) var(--k-gap) 10px;
            background: var(--kiosk-card); border-bottom: 1px solid var(--kiosk-border);
        }
        .k-appbar__logo { width: 38px; height: 38px; flex: 0 0 auto;
                          object-fit: contain; border-radius: 8px; }
        .k-appbar__id { flex: 1; min-width: 0; }
        .k-appbar__school { font-weight: 700; font-size: 16px; line-height: 1.25;
                            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .k-appbar__tagline { color: var(--kiosk-muted); font-size: 12px; letter-spacing: .02em;
                             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Judul halaman: konteks "saya sedang di mana" tanpa memakan satu layar. */
        .k-pagehead { margin-bottom: var(--k-gap); }
        .k-pagehead h1 { margin: 0 0 2px; }
        .k-pagehead p { margin: 0; color: var(--kiosk-muted); font-size: 15px; }
        h1, h2, h3 { margin: 0 0 12px; line-height: 1.3; }
        h1 { font-size: 24px; } h2 { font-size: 20px; } h3 { font-size: 18px; }
        .k-muted { color: var(--kiosk-muted); font-size: 15px; }

        /* Tombol: tinggi penuh, teks 17px, tidak pernah mengecil di layar sempit. */
        .k-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; min-height: var(--k-tap); padding: 12px 18px;
            background: var(--kiosk-primary); color: var(--kiosk-primary-ink);
            border: 0; border-radius: var(--k-radius);
            font-size: 17px; font-weight: 600; font-family: inherit;
            cursor: pointer; text-decoration: none;
        }
        .k-btn:active { filter: brightness(.92); }
        .k-btn:disabled { opacity: .5; }
        .k-btn--ghost { background: transparent; color: var(--kiosk-primary);
                        border: 2px solid var(--kiosk-border); }
        .k-btn--danger { background: var(--kiosk-danger); }
        .k-btn--sm { min-height: 48px; font-size: 16px; width: auto; padding: 10px 16px; }

        .k-input {
            width: 100%; min-height: var(--k-tap); padding: 14px;
            border: 2px solid var(--kiosk-border); border-radius: var(--k-radius);
            font-size: 17px; font-family: inherit; background: #fff; color: inherit;
        }
        .k-input:focus { outline: none; border-color: var(--kiosk-primary); }
        .k-label { display: block; font-weight: 600; font-size: 15px; margin-bottom: 6px; }

        /* Kotak status: dipakai untuk error/sukses/info yang harus terbaca jelas. */
        .k-note { border-radius: 10px; padding: 14px; font-size: 16px; border: 1px solid; }
        .k-error { color: var(--kiosk-danger); background: var(--kiosk-danger-bg); border-color: #fecaca; }
        .k-ok { color: var(--kiosk-ok); background: var(--kiosk-ok-bg); border-color: #bbf7d0; }

        /* Bar identitas: siswa harus selalu tahu login sebagai siapa. */
        .k-idbar {
            display: flex; align-items: center; gap: 12px;
            background: var(--kiosk-card); border-bottom: 1px solid var(--kiosk-border);
            padding: 12px var(--k-gap);
        }
        .k-idbar__who { flex: 1; min-width: 0; }
        .k-idbar__name { font-weight: 700; font-size: 16px;
                         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .k-idbar__sub { color: var(--kiosk-muted); font-size: 13px;
                        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Banner status simpan — menempel di atas viewport dan TIDAK hilang
           sendiri; satu-satunya cara lenyap adalah jawaban berhasil tersimpan. */
        /* sticky, bukan fixed: sebagai fixed banner ini menimpa bagian atas
           soal justru ketika siswa paling perlu membacanya. Sticky tetap
           menempel saat digulir tapi ikut memakan ruang, jadi tidak ada yang
           tertutup. */
        .k-savebar {
            position: sticky; top: 0; z-index: 9999;
            padding: 12px var(--k-gap); border-bottom: 3px solid;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .18);
        }
        .k-savebar--bad { background: #fee2e2; border-color: var(--kiosk-danger); color: #7f1d1d; }
        .k-savebar__title { font-weight: 700; font-size: 17px; }
        .k-savebar__msg { font-size: 14px; margin-top: 2px; }

        /* Toast peredam aksi (cadangan non-kiosk) — melayang di bawah agar
           tidak menutupi soal maupun banner status simpan di atas. */
        .k-ratetoast {
            position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
            z-index: 9998; max-width: 88vw;
            background: rgba(15, 23, 42, .94); color: #fff;
            padding: 12px 18px; border-radius: 999px;
            font-size: 15px; text-align: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .25);
        }

        /* Konten dari editor guru (soal, jawaban esai, kunci) bebas isinya:
           gambar berukuran asli, tabel lebar, kata panjang tanpa spasi. Tanpa
           pagar ini semuanya menembus kartu dan bikin halaman melar ke samping. */
        .k-card { overflow-wrap: anywhere; }
        .k-card img, .k-note img {
            max-width: 100%; height: auto; display: block;
            margin: 12px 0; border: 1px solid var(--kiosk-border);
            border-radius: 10px; background: #fff;
        }
        /* Tabel lebar digulir di dalam kartunya sendiri, bukan menggeser halaman. */
        .k-card table { max-width: 100%; border-collapse: collapse; }
        .k-card .table-responsive { max-width: 100%; overflow-x: auto; }
        .k-card pre { max-width: 100%; overflow-x: auto; }

        .k-row { display: flex; gap: 12px; }
        .k-row > * { flex: 1; }
        .k-stack > * + * { margin-top: 12px; }
    </style>
</head>

<div class="k-wrap" style="padding-top:5vh">

        <div>Server: <strong id="serverInfo">&nbsp;</strong></div>
        <div style="margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap">
            <span id="connBadge" style="padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:#e2e8f0;color:#475569">Memeriksa koneksi…</span>
            <button type="button" id="btnTestConn" style="background:none;border:none;color:var(--kiosk-primary);cursor:pointer;font-size:12px;text-decoration:underline;padding:2px 4px">Tes Ulang</button>
        </div>
        <div id="connDetail" style="display:none;margin:8px auto 0;max-width:440px;font-size:12px;text-align:left;color:var(--kiosk-danger);background:var(--kiosk-danger-bg);border:1px solid #fecaca;padding:8px 12px;border-radius:8px;word-break:break-word"></div>
    </div>
</div>

<script>
    (function () {
        var base = window.KIOSK_BASE_URL;
        localStorage.setItem('kiosk_base_url', base);

        // Tunjukkan server yang dituju: kalau perangkat salah diarahkan,
        // ini satu-satunya petunjuk yang siswa/pengawas punya sebelum login.
        try {
            document.getElementById('serverInfo').textContent = new URL(base).host;
        } catch (e) {
            document.getElementById('serverInfo').textContent = base || '';
        }

        var form = document.getElementById('loginForm');
        var btn = document.getElementById('btn');
        var err = document.getElementById('err');
        var connBadge = document.getElementById('connBadge');
        var btnTestConn = document.getElementById('btnTestConn');
        var connDetail = document.getElementById('connDetail');

        function checkServerConnection() {
            if (!connBadge) return;
            connBadge.textContent = 'Menghubungi…';
            connBadge.style.background = '#e2e8f0';
            connBadge.style.color = '#475569';
            if (connDetail) connDetail.style.display = 'none';

            var t0 = Date.now();
            var controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
            var timeoutId = controller ? setTimeout(function () { controller.abort(); }, 5000) : null;

            fetch(base + '/health', {
                method: 'GET',
                cache: 'no-store',
                signal: controller ? controller.signal : undefined
            }).then(function (res) {
                if (timeoutId) clearTimeout(timeoutId);
                var lat = Date.now() - t0;
                if (res.ok) {
                    connBadge.textContent = '● Terhubung (' + lat + 'ms)';
                    connBadge.style.background = '#dcfce7';
                    connBadge.style.color = '#15803d';
                } else {
                    connBadge.textContent = '● HTTP ' + res.status;
                    connBadge.style.background = '#fee2e2';
                    connBadge.style.color = '#b91c1c';
                    if (connDetail) {
                        connDetail.textContent = 'Server merespon kode: HTTP ' + res.status;
                        connDetail.style.display = 'block';
                    }
                }
            }).catch(function (e) {
                if (timeoutId) clearTimeout(timeoutId);
                connBadge.textContent = '● Gagal Terhubung';
                connBadge.style.background = '#fee2e2';
                connBadge.style.color = '#b91c1c';
                var msg = e.name === 'AbortError' ? 'Koneksi timeout (>5 detik).' : (e.message || 'Tidak dapat menjangkau server.');
                if (connDetail) {
                    connDetail.innerHTML = '<strong>Error Koneksi:</strong> ' + msg + '<br><small>Pastikan HP & PC di Wi-Fi yang sama, port 8080 diizinkan di firewall Windows, dan Mixed Content HTTP diizinkan jika menggunakan Android WebView.</small>';
                    connDetail.style.display = 'block';
                }
            });
        }

        if (btnTestConn) {
            btnTestConn.addEventListener('click', checkServerConnection);
        }
        checkServerConnection();

        function fail(msg) {
            err.textContent = msg;
            err.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Masuk';
        }

        /* Diambil dari jembatan native. Di luar aplikasi kiosk jembatannya
           tidak ada, dan string kosong itu benar: server memperlakukan login
           tanpa device_id sebagai tidak boleh merebut sesi perangkat lain.

           Periksa `typeof ... === 'function'`, bukan sekadar keberadaan
           window.CommsBridge: bundle bisa lebih baru daripada APK-nya. Di APK
           lama jembatannya ada tapi getDeviceId belum, dan pemeriksaan longgar
           akan melempar TypeError di tengah handler submit — login gagal total,
           bukan sekadar tanpa ambil-alih. */
        function deviceId() {
            try {
                if (window.CommsBridge && typeof window.CommsBridge.getDeviceId === 'function') {
                    return window.CommsBridge.getDeviceId() || '';
                }
            } catch (e) { /* jaring pengaman; jalur nyata ditangani || '' di atas */ }
            return '';
        }

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            var u = document.getElementById('username').value.trim();
            var p = document.getElementById('password').value;
            if (!u || !p) { fail('Username dan password wajib diisi.'); return; }

            btn.disabled = true;
            btn.textContent = 'Memeriksa…';
            err.style.display = 'none';

            fetch(base + '/login', {
                method: 'POST',
                credentials: 'include',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-Requested-With': 'kiosk-bundle'
                },
                body: 'username=' + encodeURIComponent(u)
                    + '&password=' + encodeURIComponent(p)
                    + '&device_id=' + encodeURIComponent(deviceId())
            }).then(function (r) {
                return r.text().then(function (txt) {
                    try {
                        return { ok: r.ok, status: r.status, j: JSON.parse(txt) };
                    } catch (e) {
                        return { ok: r.ok, status: r.status, raw: txt };
                    }
                });
            }).then(function (res) {
                if (res.j && res.j.status === 'success') {
                    if (res.j.session_id) {
                        try { localStorage.setItem('kiosk_session_id', res.j.session_id); } catch (e) {}
                    }
                    location.href = 'dashboard.html' + window.location.search;
                } else if (res.j && res.j.message) {
                    fail(res.j.message);
                } else {
                    fail('Respon server (HTTP ' + res.status + '): ' + (res.raw ? res.raw.substring(0, 100) : 'Gagal memproses login.'));
                }
            }).catch(function (error) {
                fail('Gagal terhubung ke ' + base + ' (' + (error.message || 'NetworkError') + '). Periksa status server di bawah.');
                checkServerConnection();
            });
        });
    })();
</script>
